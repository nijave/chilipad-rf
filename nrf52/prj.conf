# chilipad-sniffer, nRF52840 Dongle (PCA10059)

# USB CDC ACM is the serial interface.  nrf52840dongle already defaults to the
# CDC ACM serial backend; spelled out here so a defconfig change cannot drop it
# silently.  This is the Zephyr 4.4 USB device stack next + CDC ACM UART, no
# snippet flag needed.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# USB descriptors.
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="chilipad-sniffer"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="chilipad-rf"

# uart_fifo_fill() is used from the main thread for non-blocking output; the
# optional dedicated CDC ACM workqueue would reject that context.
CONFIG_USBD_CDC_ACM_WORKQUEUE=n

# One packet line is up to ~1.1 kB with a 255 byte payload; all formatting
# happens on the main thread with static buffers, this only covers the rest.
CONFIG_MAIN_STACK_SIZE=2048

# Second command port on the hardware UART (uart0, see app.overlay).  Its RX
# and TX run from the UART interrupt so the 1 ms main loop neither loses
# input bytes nor waits on the 115200 baud line.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_0_INTERRUPT_DRIVEN=y
