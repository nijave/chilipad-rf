name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.2
      - name: IQ demodulator tests
        run: cd analysis/scripts && uv run --locked --project .. python -m unittest test_iq
      - name: Bridge self-test
        run: cd bridge && uv run --locked chilipad_bridge.py --selftest

  # Bridge image: ghcr.io/<owner>/chilipad-rf. Pull requests build it without
  # pushing; main pushes :latest and :<short sha> (the tags bridge/build.sh
  # uses, and :latest is what Podman AutoUpdate=registry follows); a v* tag
  # also pushes the tag as written.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # arm64 for the Pine A64 host; QEMU emulates it on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{raw}}
      # Smoke test before any push: the amd64 image must start as its
      # non-root user.
      - uses: docker/build-push-action@v7
        with:
          context: bridge
          file: bridge/Containerfile
          platforms: linux/amd64
          load: true
          tags: chilipad-rf:smoke
          cache-from: type=gha
      - name: Smoke test
        run: docker run --rm chilipad-rf:smoke --help
      - uses: docker/build-push-action@v7
        with:
          context: bridge
          file: bridge/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
